<script>
(() => {
'use strict';

/* ============================================================================
   YeAI · All in AI — realtime GPU particle experience
   WebGL2 · transform-feedback physics · HDR trails · dual-filter bloom
   ========================================================================== */

const $ = (s) => document.querySelector(s);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const damp = (k, dt) => 1 - Math.exp(-k * dt);
let vclock = 0;
const nowMs = () => (window.__CAPTURE ? vclock : performance.now());
// deterministic timers & frame callbacks while rendering a video (driven by simulation time)
const timers = [], rafQ = [];
const later = (fn, ms) => { if (window.__CAPTURE) timers.push({ at: vclock + ms, fn }); else setTimeout(fn, ms); };
const nextFrame = (fn) => { if (window.__CAPTURE) rafQ.push(fn); else requestAnimationFrame(fn); };

const canvas = $('#gl');
const coarse = matchMedia('(pointer: coarse)').matches;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const params = new URLSearchParams(location.search);
const CAPTURE = params.has('capture');
window.__CAPTURE = CAPTURE;
if (CAPTURE) document.body.classList.add('capture');
if (coarse) document.body.classList.add('touch');

function fail(msg) {
  console.error(msg);
  $('#nogl').hidden = false;
  $('#ui').style.display = 'none';
  canvas.style.display = 'none';
  document.body.style.cursor = 'auto';
}

const gl = canvas.getContext('webgl2', {
  antialias: false, alpha: false, depth: false, stencil: false,
  premultipliedAlpha: false, preserveDrawingBuffer: CAPTURE, powerPreference: 'high-performance',
});
if (!gl) { fail('WebGL2 unavailable'); return; }

const N = (() => {
  const q = parseInt(params.get('n'), 10);
  if (q > 1000) return Math.min(q, 1 << 20);
  const small = Math.min(screen.width, screen.height) < 600;
  return coarse || small ? 131072 : 262144;
})();
let COUNT = N;

/* ---------------------------------------------------------------- shaders */
const HASH = `
uint pcg(uint v){ uint s = v * 747796405u + 2891336453u; uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u; return (w >> 22u) ^ w; }
float u2f(uint h){ return float(h >> 8u) * (1.0 / 16777216.0); }
vec4 rnd4(uint id){ uint a = pcg(id * 4u + 17u); uint b = pcg(a); uint c = pcg(b); uint d = pcg(c); return vec4(u2f(a), u2f(b), u2f(c), u2f(d)); }
`;

const SIM_VS = `#version 300 es
precision highp float;
precision highp int;
layout(location=0) in vec4 a_pos;
layout(location=1) in vec4 a_vel;
layout(location=2) in vec4 a_ta;
layout(location=3) in vec4 a_tb;
out vec4 v_pos;
out vec4 v_vel;
uniform float u_time, u_dt, u_switchT, u_stagger, u_transK;
uniform mat3 u_rotA, u_rotB;
uniform int u_kindA, u_kindB;
uniform vec4 u_inf;
uniform float u_spring, u_turb, u_swirl, u_drag, u_breath;
uniform float u_seedOn, u_seedR, u_bang, u_scrollV;
uniform vec3 u_mouse, u_mouseVel;
uniform vec4 u_mouseP;
uniform float u_mouseOn;
uniform vec3 u_hole;
uniform float u_hold;
uniform vec4 u_shock[8];
uniform vec4 u_shockP[8];
${HASH}
// divergence-free trig flow: every component ignores its own axis
vec3 flow(vec3 p, float t){
  vec3 f = vec3(
    sin(p.y * 1.31 + t * 0.61) + 0.6 * sin(p.z * 2.17 - t * 0.43),
    sin(p.z * 1.19 + t * 0.53) + 0.6 * sin(p.x * 2.03 + t * 0.37),
    sin(p.x * 1.27 - t * 0.47) + 0.6 * sin(p.y * 2.29 + t * 0.31));
  f += 0.45 * vec3(sin(p.y * 3.7 + p.z * 1.3 + t * 1.1), sin(p.z * 3.3 + p.x * 1.1 - t * 0.9), sin(p.x * 3.9 + p.y * 1.7 + t * 0.8));
  return f;
}
vec3 lem(float t, float A){ float s = sin(t), c = cos(t); float d = 1.0 + s * s; return vec3(A * c / d, A * s * c / d, A * 0.24 * s); }
vec3 infPos(vec4 q, float h){
  float t = fract(q.x + u_time * (0.03 + 0.045 * h)) * 6.2831853;
  vec3 p = lem(t, u_inf.x);
  vec3 T = normalize(lem(t + 0.02, u_inf.x) - lem(t - 0.02, u_inf.x));
  vec3 N1 = normalize(cross(T, vec3(0.0, 0.0, 1.0)));
  vec3 B1 = cross(T, N1);
  float ph = q.y + u_time * 0.7;
  float tube = u_inf.y * (0.8 + 0.3 * sin(t * 4.0 - u_time * 1.6));
  p += (N1 * cos(ph) + B1 * sin(ph)) * tube * q.z;
  p.y += u_inf.z;
  return p;
}
vec3 targetOf(vec4 q, int kind, mat3 rot, float h){
  vec3 p = kind == 1 ? infPos(q, h) : q.xyz;
  return rot * p;
}
void main(){
  vec4 R = rnd4(uint(gl_VertexID));
  vec3 pos = a_pos.xyz;
  vec3 vel = a_vel.xyz;
  float flash = a_pos.w;
  float dt = u_dt;

  if (u_seedOn > 0.5) {
    // the heartbeat: everything collapsed into a pulsing singularity
    float th = R.x * 6.2831853 + u_time * (1.0 + R.y * 3.0);
    float cp = 2.0 * R.y - 1.0;
    float sp = sqrt(max(0.0, 1.0 - cp * cp));

    vec4 S = u_shock[i];
    vec4 P = u_shockP[i];
    float age = u_time - S.w;
    if (P.x <= 0.0 || age < 0.0 || age > 3.0) continue;

const ti = $('#ti');

  const added = v.length > prev.length;

// pointer events
function setXY(e) { P.x = e.clientX; P.y = e.clientY; P.nx = P.x / cssW * 2 - 1; P.ny = 1 - P.y / cssH * 2; }

window.addEventListener('pointerdown', (e) => {

/* ----------------------------------------------------------- per-frame */
function updateIntro(dt) {
  if (intro.bang < 0) {
    const t = T;
    const beat = (c, w) => Math.exp(-(((t - c) / w) ** 2));
    const b = beat(0.42, 0.07) + 0.75 * beat(0.68, 0.06) + 1.25 * beat(1.12, 0.09);
    seedBeat = b;
    if (intro.beat < BEATS.length && t >= BEATS[intro.beat][0] - 0.02) Snd.heartbeat(BEATS[intro.beat++][1]);
    sim.seedOn = 1;
    sim.seedR = (0.06 + 0.12 * b) * (1 - 0.8 * smooth(1.18, 1.5, t));
    introInt = 0.016 * (1 + b * 0.8);
    if (t > 1.52 && F[0].ready) {
      intro.bang = T; bangPending = true; sim.seedOn = 0;
      fx.flash = 1.6; fx.shake = reduced ? 0 : 0.7; fx.ca = 3; fx.zoom = 0.016; fx.punch = 0.6;
      rings.push({ p: [0, 0, 0], t0: T, spd: 9, amp: 0.05 });
      Snd.explode(1, 0);

  }
  const tb = T - intro.bang;

  sim.spring = easeIO(clamp((tb - 0.75) / 2.5, 0, 1));
  sim.drag = lerp(1.1, 3.9, clamp((tb - 0.4) / 2.2, 0, 1));
  sim.turb = lerp(2.6, BASE_TURB, smooth(0.2, 3.4, tb));

  if (!intro.cap && tb > 3.2) { intro.cap = true; setCaption(FORMS[0].cap[0], FORMS[0].cap[1]); [...ui.nav.children][0].classList.add('on'); }

const AUTO_EV = [[1.8, 'click'], [3.2, 'hold'], [5.0, 'release'], [7.4, 'click'], [8.3, 'click'], [11.2, 'morph']];
function updateAuto(dt) {

  if (want && !auto.on) { auto.on = true; auto.t = 0; auto.pt = 0; auto.i = 0; auto.cyc = 0; }
  if (!auto.on) return;
  const sp = auto.charging ? 0.22 : 1;
  auto.t += dt; auto.pt += dt * sp;
  const pt = auto.pt;
  auto.nx = Math.sin(pt * 0.62 - 1.57) * (coarse ? 0.55 : 0.6);
  auto.ny = Math.sin(pt * 1.24) * 0.14 + 0.08;
  auto.touch = false;
  const cyc = Math.floor(auto.t / 13), ct = auto.t - cyc * 13;
  if (cyc !== auto.cyc) { auto.cyc = cyc; auto.i = 0; }
  while (auto.i < AUTO_EV.length && ct >= AUTO_EV[auto.i][0]) {
    const ev = AUTO_EV[auto.i++][1];
    if (ev === 'click') shockAtPointer(auto);
    else if (ev === 'hold') { auto.charging = true; auto.cs = T; Snd.chargeStart(pan(auto.nx)); }
    else if (ev === 'release' && auto.charging) { auto.charge = Math.min(1, (T - auto.cs) / 2.2); releaseHole(auto); auto.charging = false; auto.charge = 0; }

  ui.ghost.style.opacity = 1;
}

function updateInput(dt) {
  if (P.down && !P.drag && !P.charging && nowMs() - P.t0 > 230) {
    P.charging = true; P.cs = T; Snd.chargeStart(pan(P.nx)); discover('hold');
  }
  if (P.charging) P.charge = Math.min(1, (T - P.cs) / 2.2);
  const src = P.has ? P : auto.on ? auto : null;
  inp.on += ((src ? (src === auto ? 0.85 : 1) : 0) - inp.on) * damp(10, dt);
  let speedPx = 0;
  if (src) {
    const w = worldAt(src.nx, src.ny);
    if (inp.has) {
      const k = damp(18, dt);
      for (let i = 0; i < 3; i++) inp.vel[i] += (clamp((w[i] - inp.w[i]) / dt, -40, 40) - inp.vel[i]) * k;
    }
    inp.w = w; inp.has = true;
    speedPx = Math.hypot(inp.vel[0], inp.vel[1]) * cssH / (2 * visHH);
  } else {
    inp.has = false;
    for (let i = 0; i < 3; i++) inp.vel[i] *= Math.exp(-dt * 8);
  }
  inp.speed = speedPx;
  const tk = src && src.touch ? (CAPTURE ? 2.0 : 1.6) : 1;
  const strong = src && (src.drag || (src === P && P.down && !P.charging));
  const target = strong ? [1.35 * tk, 46, 24, 6.0] : [0.95 * tk, 18, 10, 3.2];
  for (let i = 0; i < 4; i++) inp.p[i] += (target[i] - inp.p[i]) * damp(8, dt);
  const charging = src && src.charging;
  const holdT = charging ? 0.15 + 0.85 * src.charge : 0;
  inp.hold += (holdT - inp.hold) * damp(charging ? 6 : 30, dt);
  if (charging) inp.hole = worldAt(src.nx, src.ny);
  scroll.v += (scroll.imp - scroll.v) * damp(10, dt);
  scroll.imp *= Math.exp(-dt * 5);
  scroll.acc *= Math.exp(-dt * 2.5);
}

function updateFX(dt) {
  fx.flash *= Math.exp(-dt * 3.2);
  fx.shake *= Math.exp(-dt * 4.5);
  fx.punch *= Math.exp(-dt * 3.5);
  fx.zoom *= Math.exp(-dt * 3);
  fx.persistBoost *= Math.exp(-dt * 1.6);
  fx.ca = 0.4 + (fx.ca - 0.4) * Math.exp(-dt * 3);
  if (fx.celebrate >= 0) {
    const ct = T - fx.celebrate;
    const env = smooth(0, 0.4, ct) * (1 - smooth(3.2, 4.6, ct));
    fx.hue = ct * 2.4 * env; fx.hueSpread = env * 1.2;

function updateCamera(dt) {
  const src = P.has ? P : auto.on ? auto : null;
  const tx = src ? src.nx : 0, ty = src ? src.ny : 0;
  const tyaw = tx * (CAPTURE ? 0.09 : 0.16) + Math.sin(T * 0.11) * (CAPTURE ? 0.035 : 0.06);
  const tpitch = -ty * 0.1 + Math.sin(T * 0.083) * 0.03;
  cam.yaw += (tyaw - cam.yaw) * damp(2.2, dt);
  cam.pitch += (tpitch - cam.pitch) * damp(2.2, dt);

  const sh = (reduced ? 0 : 1) * (fx.shake + inp.hold * inp.hold * 0.06) * 0.06 * (camD / 10);

function rotFor(i) {

  if (i === 3) return mul3(rotX(0.25 + Math.sin(T * 0.21) * 0.2), rotY(Math.sin(T * 0.17) * 0.45));
  return mul3(rotY(Math.sin(T * 0.33) * 0.07), rotX(Math.sin(T * 0.27) * 0.04));

/* ------------------------------------------------------------- GPU steps */
function simStep(h, tNow, bang, rotA, rotB) {
  const src = cur, dst = cur ^ 1;
  const p = simP;
  gl.useProgram(p.p);
  p.f1('u_time', tNow); p.f1('u_dt', h); p.f1('u_switchT', switchT); p.f1('u_stagger', stagger); p.f1('u_transK', transK);

  p.f4('u_inf', infA, infTube, infYo, 0);
  p.f1('u_spring', sim.spring); p.f1('u_turb', sim.turb); p.f1('u_swirl', sim.swirl); p.f1('u_drag', sim.drag); p.f1('u_breath', sim.breath);

  p.v4('u_shock', shockA); p.v4('u_shockP', shockB);

  gl.bindVertexArray(simVAO);
  attr(0, posB[src]); attr(1, velB[src]); attr(2, F[fromIdx].buf); attr(3, F[toIdx].buf);
  gl.bindBuffer(gl.ARRAY_BUFFER, null);
  gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);
  gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, posB[dst]);
  gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 1, velB[dst]);
  gl.enable(gl.RASTERIZER_DISCARD);
  gl.beginTransformFeedback(gl.POINTS);
  gl.drawArrays(gl.POINTS, 0, COUNT);
  gl.endTransformFeedback();
  gl.disable(gl.RASTERIZER_DISCARD);
  gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, null);
  gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 1, null);

function drawQuad() { gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLES, 0, 3); }
function bindTex(unit, tex) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); }

function render(persist, intensity) {

  gl.disable(gl.BLEND);
  gl.useProgram(fadeP.p);

  fadeP.f1('u_rot', clamp(scroll.v, -2, 2) * 0.002 + inp.hold * 0.004);
  drawQuad();

  // 2) stars, bokeh, particles — additive
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);

  starP.m4('u_vp', cam.vp); starP.m4('u_view', cam.view);
  starP.f1('u_time', T); starP.f1('u_pr', pr); starP.f1('u_camD', camD); starP.f1('u_tanh', TANH); starP.f1('u_aspect', aspect);

  starP.f1('u_int', (1 - persist) / 0.5 * Math.min(1, introInt * 2 + 0.15));
  gl.bindVertexArray(starVAO);
  starP.f1('u_mode', 1); gl.drawArrays(gl.POINTS, STARS, BOKEH);

  gl.useProgram(renP.p);
  renP.m4('u_vp', cam.vp); renP.m4('u_view', cam.view);
  const textPx = (10 / (2 * visHW)) * W;
  renP.f1('u_size', clamp(textPx / 1460 * 2.3 * Math.sqrt(262144 / COUNT), 1.0, 9.0));
  renP.f1('u_time', T); renP.f1('u_int', intensity); renP.f1('u_span', Math.max(1, F[toIdx].halfW)); renP.f1('u_camD', camD);
  renP.f1('u_hue', fx.hue); renP.f1('u_hueSpread', fx.hueSpread);
  renP.f3('u_c1', pal[0]); renP.f3('u_c2', pal[1]); renP.f3('u_c3', pal[2]);
  let sx = 0, sa = 0;
  const sp = (T - sweep.t0) / sweep.dur;
  if (sp >= 0 && sp <= 1) { const hw = F[toIdx].halfW + 2; sx = lerp(-hw, hw, easeIO(sp)); sa = Math.sin(sp * Math.PI); }
  renP.f2('u_sweep', sx, sa);
  gl.bindVertexArray(renVAO);
  attr(0, posB[cur]); attr(1, velB[cur]); attr(2, F[toIdx].buf);
  gl.bindBuffer(gl.ARRAY_BUFFER, null);
  gl.drawArrays(gl.POINTS, 0, COUNT);

    gl.bindFramebuffer(gl.FRAMEBUFFER, m.fbo); gl.viewport(0, 0, m.w, m.h);
    bindTex(0, srcTex);
    downP.f2('u_texel', 1 / sw, 1 / sh); downP.f1('u_pre', i === 0 ? 1 : 0);
    drawQuad();

  upP.i1('u_tex', 0); upP.f1('u_k', 1);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);

  gl.disable(gl.BLEND);

}

const ringU = new Float32Array(16);
function updateRings() {
  ringU.fill(0);
  let n = 0;
  for (let i = rings.length - 1; i >= 0 && n < 4; i--) {
    const r = rings[i], age = T - r.t0;
    if (age > 1.6) continue;
    const c = project(r.p);
    ringU[n * 4] = c[2] * 0.5 + 0.5;
    ringU[n * 4 + 1] = c[3] * 0.5 + 0.5;
    ringU[n * 4 + 2] = (age * r.spd) / (2 * visHH);
    ringU[n * 4 + 3] = r.amp * Math.exp(-age * 2.2) * smooth(0, 0.05, age);
    n++;

}

/* ---------------------------------------------------------- HUD + perf */
const perf = { acc: 0, n: 0, t: 0, cool: 4, good: 0 };
function perfTick(dt) {
  perf.acc += dt; perf.n++; perf.t += dt;
  if (perf.t < 1) return;
  const avg = perf.acc / perf.n;
  perf.acc = 0; perf.n = 0; perf.t = 0;
  ui.fps.textContent = Math.round(1 / avg);
  ui.pc.textContent = COUNT.toLocaleString('en-US');
  if (document.hidden || params.has('n')) return;
  if (perf.cool > 0) { perf.cool--; return; }
  if (avg > 1 / 40) {
    perf.good = 0;
    if (qScale > 0.62) { qScale = Math.max(0.6, qScale * 0.82); resizeTargets(); perf.cool = 2; }
    else if (COUNT > N / 4) { COUNT = Math.max((N / 4) | 0, (COUNT * 0.75) | 0); perf.cool = 2; }
  } else if (avg < 1 / 56) {
    if (++perf.good > 4) {
      perf.good = 0;
      if (COUNT < N) { COUNT = Math.min(N, (COUNT * 1.25) | 0); perf.cool = 3; }
      else if (qScale < 1) { qScale = Math.min(1, qScale * 1.12); resizeTargets(); perf.cool = 3; }

}
let capFrame = 0, lastCapTop = -1;
const ripEls = [];
const capUI = { cur: 0, ring: 1, top: -1, fadeEls: null };
const chapEl = $('#chap'), chapN = $('#chap .n span'), chapT = $('#chap .t'), chapE = $('#chap .e'), fadeEl = $('#fade');
function updateRipples() {
  while (ripEls.length < 6) { const d = document.createElement('div'); d.className = 'rip'; document.body.appendChild(d); ripEls.push(d); }
  for (let i = 0; i < ripEls.length; i++) {
    const r = rips[i], el = ripEls[i];
    if (!r) { el.style.opacity = 0; continue; }
    const age = T - r.t0, life = r.big ? 1.1 : 0.75;
    if (age > life) { el.style.opacity = 0; continue; }
    const p = age / life, sc = (r.big ? 0.6 + 7 * p : 0.4 + 3.2 * p);
    el.style.transform = `translate3d(${r.x}px,${r.y}px,0) scale(${sc.toFixed(3)})`;
    el.style.opacity = ((1 - p) * (1 - p) * (r.big ? 1 : 0.9)).toFixed(3);
  }
}
function updateCaptureUI(dt) {
  if (!capUI.fadeEls) capUI.fadeEls = [...document.querySelectorAll('.rv'), ui.capEl, ui.capS, ui.typed, ui.flash];
  const on = document.body.classList.contains('ui-on');
  for (const el of capUI.fadeEls) {
    const want = el.classList.contains('rv') ? (on ? 1 : 0) : (el.classList.contains('on') ? 1 : 0);
    el._o = (el._o || 0) + (want - (el._o || 0)) * damp(el === ui.capS ? 3.5 : 4.5, dt);
    el.style.opacity = el._o.toFixed(3);
  }

  // chapter titles
  let a = 0, L = null;

  if (L) {

    if (chapEl._k !== L) { chapEl._k = L; chapN.textContent = L[2]; chapT.textContent = L[3]; chapE.textContent = L[4]; chapEl.classList.toggle('end', !L[2]); chapEl.querySelector('.n').style.visibility = L[2] ? 'visible' : 'hidden'; }
  }

  chapT.style.letterSpacing = (0.26 + (1 - a) * 0.18).toFixed(3) + 'em';

}
function updateHUD() {

/* ------------------------------------------------------------ video shot */
const SHOT = {
  dur: 29.5,
  labels: [
    [0.12, 1.3, '', '一切，始于一个点', 'EVERYTHING STARTS FROM ONE POINT'],
    [5.0, 7.15, '01', '触碰', 'TOUCH · DRAG'],
    [7.3, 8.6, '02', '冲击波', 'TAP'],
    [8.8, 11.5, '03', '黑洞', 'PRESS & HOLD'],
    [11.55, 12.35, '03', '超新星', 'RELEASE', true],
    [12.6, 14.3, '04', '变形', 'SWIPE'],
    [19.62, 22.95, '05', '书写', 'TYPE ANYTHING'],
    [25.4, 28.9, '', '以上全部实时生成', 'REALTIME · 262,144 GPU PARTICLES'],

const fired = new Set();
const once = (k, t, at, fn) => { if (t >= at && !fired.has(k)) { fired.add(k); fn(); } };
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);

function lerpP(t, a, b, x0, y0, x1, y1) { if (t >= a && t < b) { const u = eio(seg(t, a, b)); setP(lerp(x0, x1, u), lerp(y0, y1, u)); } }

function lift() { P.down = false; P.drag = false; P.charging = false; P.charge = 0; }
function infNDC(s) {
  const c = Math.cos(s), sn = Math.sin(s), d = 1 + sn * sn;
  const p = [infA * c / d, infA * sn * c / d + infYo, infA * 0.24 * sn];
  const m = rotFor(3);
  const w = [m[0] * p[0] + m[3] * p[1] + m[6] * p[2], m[1] * p[0] + m[4] * p[1] + m[7] * p[2], m[2] * p[0] + m[5] * p[1] + m[8] * p[2]];

}
function typeTo(v) { ti.value = v; onType(); }
function director(t) {

  if (t >= 4.95 && t < 6.3) P.ny = 0.03 + 0.06 * Math.sin(seg(t, 4.95, 6.3) * Math.PI * 2);
  once('mv', t, 5.4, () => discover('move'));
  lerpP(t, 6.3, 6.42, 1.12, 0.03, 0.85, 0.22);
  once('dd', t, 6.42, () => press(true));
  if (t >= 6.42 && t < 7.05) { const u = eio(seg(t, 6.42, 7.05)); setP(lerp(0.85, -0.85, u), lerp(0.22, -0.16, u) + 0.05 * Math.sin(u * Math.PI * 3)); }
  once('dg', t, 6.5, () => discover('drag'));
  once('du', t, 7.05, lift);
  // 02 · shockwaves
  lerpP(t, 7.05, 7.42, -0.85, -0.16, 0.25, 0.05);
  once('t1d', t, 7.42, () => press(false));
  once('t1', t, 7.5, () => { lift(); shockAtPointer(P); discover('click'); });
  lerpP(t, 7.6, 7.92, 0.25, 0.05, -0.5, 0.02);
  once('t2d', t, 7.92, () => press(false));
  once('t2', t, 8.0, () => { lift(); shockAtPointer(P); });
  // 03 · black hole → supernova
  lerpP(t, 8.2, 8.75, -0.5, 0.02, 0.0, 0.04);
  once('hd', t, 8.8, () => press(false));
  if (t >= 9.6 && t < 11.5) { const u = seg(t, 9.6, 11.5); setP(0.3 * Math.sin(u * Math.PI * 1.5), 0.04 + 0.03 * Math.sin(u * Math.PI * 3)); }
  once('hu', t, 11.55, () => { if (P.charging) releaseHole(P); lift(); });
  once('hl', t, 12.1, () => { P.has = false; });
  // 04 · morphs (each formation gets time to crystallise before the finger plays with it)
  once('s1d', t, 12.5, () => { setP(0.0, -0.5); press(true); });
  lerpP(t, 12.5, 12.78, 0.0, -0.5, 0.05, 0.3);
  once('s1', t, 12.7, () => morphBy(1));
  once('s1u', t, 12.8, lift);
  once('s1h', t, 13.05, () => { P.has = false; });
  once('s2d', t, 14.25, () => { setP(-0.05, -0.5); press(true); });
  lerpP(t, 14.25, 14.52, -0.05, -0.5, 0.0, 0.3);
  once('s2', t, 14.45, () => morphBy(1));
  once('s2u', t, 14.55, lift);
  once('s2h', t, 14.75, () => { P.has = false; });

  once('s3', t, 17.2, () => morphBy(1));

/* ------------------------------------------------------------- main loop */
let last = nowMs(), raf = 0, rzT = 0;
function frame(now) {
  raf = requestAnimationFrame(frame);

  if (!(dt > 0)) dt = 1 / 60;
  tick(Math.min(dt, 1 / 20));
}
function tick(dt) {
  T += dt;

    const q = rafQ.splice(0); q.forEach((fn) => fn());
    director(T);
  }
  perfTick(dt);
  if (buildQ.length) build(buildQ.shift());

  updateIntro(dt);
  updateAuto(dt);
  updateInput(dt);
  updateFX(dt);
  updateCamera(dt);
  updateRings();
  for (let i = 0; i < 8; i++) {
    const s = shocks[i];
    shockA[i * 4] = s.p[0]; shockA[i * 4 + 1] = s.p[1]; shockA[i * 4 + 2] = s.p[2]; shockA[i * 4 + 3] = s.t0;
    shockB[i * 4] = s.str; shockB[i * 4 + 1] = s.spd; shockB[i * 4 + 2] = s.w; shockB[i * 4 + 3] = 0;
  }

    if (s === 0) bangPending = false;
  }

  const persist = clamp(0.5 + introPersist + fx.persistBoost + Math.abs(scroll.v) * 0.12 + inp.hold * 0.25, 0, 0.93);
  const areaK = F[toIdx].area && F[0].area ? clamp(F[toIdx].area / F[0].area, 0.32, 1.25) : 1;
  densK += (areaK - densK) * damp(3, dt);
  const intensity = 0.3 * densK * (1 - inp.hold * 0.35) * Math.pow((1 - persist) / 0.5, 0.72) * introInt * (HDR ? 1 : 0.45);
  render(persist, intensity);

}

window.addEventListener('resize', () => {
  if (coarse && document.activeElement === ti && innerWidth === cssW) return;

    const oldW = cssW, oldH = cssH;

focusTI();
updateCamera(0);
if (!CAPTURE) raf = requestAnimationFrame(frame);

// video capture API: deterministic 60 fps stepping driven by a headless browser

  async prepare(dur) {

// debug hooks (handy for QA in the console)
window.__yeai = { goTo, celebrate,
  advance(sec, step = 1 / 60) { cancelAnimationFrame(raf); for (let t = 0; t < sec; t += step) tick(step); last = nowMs(); raf = requestAnimationFrame(frame); },
  pause() { cancelAnimationFrame(raf); }, resume() { last = nowMs(); raf = requestAnimationFrame(frame); },
  pointer(nx, ny) { P.nx = nx; P.ny = ny; P.x = (nx * 0.5 + 0.5) * cssW; P.y = (0.5 - ny * 0.5) * cssH; P.has = true; userInput(); },
  click(nx, ny) { this.pointer(nx, ny); shockAtPointer(P); },
  holdStart(nx, ny) { this.pointer(nx, ny); P.down = true; P.drag = false; P.charging = true; P.cs = T; P.charge = 0; },
  holdEnd() { releaseHole(P); P.down = false; P.charging = false; P.charge = 0; },
  type(v) { ti.value = v; onType(); },
  peek(i, n = 4096) {
    const a = new Float32Array(n * 4);

    return { kind: F[i].kind, ready: F[i].ready, nan, mn: mn.map((v) => +v.toFixed(2)), mx: mx.map((v) => +v.toFixed(2)), first: Array.from(a.slice(0, 8)).map((v) => +v.toFixed(2)) };
  },

  }, get state() { return { T, toIdx, COUNT, qScale, W, H, HDR, fps: ui.fps.textContent }; } };
})();
